os:
  edit: >-
    nvim --server "$NVIM" --remote-expr "v:lua.require'core.lazygit'.edit_hex('$(printf '%s\0' {{filename}} | od -An -v -tx1 | tr -d ' \n')')"
  editAtLine: >-
    nvim --server "$NVIM" --remote-expr "v:lua.require'core.lazygit'.edit_hex('$(printf '%s\0' {{filename}} | od -An -v -tx1 | tr -d ' \n')', {{line}})"
  editInTerminal: false
  editAtLineAndWait: nvim +{{line}} -- {{filename}}
  openDirInEditor: >-
    nvim --server "$NVIM" --remote-expr "v:lua.require'core.lazygit'.edit_hex('$(printf '%s\0' {{dir}} | od -An -v -tx1 | tr -d ' \n')')"
git:
  autoFetch: false
